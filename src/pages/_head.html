body{background:var(--bg);color:var(--ink);font:15px/1.85 "Noto Sans JP",system-ui,sans-serif;padding:32px max(16px,env(safe-area-inset-right,0px)) 64px max(16px,env(safe-area-inset-left,0px))}

.back{font-size:14px;text-decoration:none}

h2{font-size:17px;margin:32px 0 8px;padding-bottom:6px;border-bottom:1px solid var(--line)}
ul{padding-left:1.3em}
