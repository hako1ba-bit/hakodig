# ページのデザインや別名の対応表を変えたときに、データは取り直さずサイトだけ作り直す
name: サイトの作り直し
on:
  push:
    branches: [main]
    paths: ["src/**", "worker/**", "wrangler.toml", "scripts/build.py", "data/aliases.json", "data/kana_words.txt", "data/ja_names.json", "data/publishers.json", "data/overrides.json", ".github/run-build"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q alkana==0.0.3
      - run: python scripts/build.py
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Cloudflare に公開（データベースの更新も）
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          npx -y wrangler@4.151.0 d1 migrations apply hakodig --remote
          npx -y wrangler@4.151.0 deploy
      # 旧アドレス（GitHub Pages）は新しいアドレスへの案内だけにする
      - uses: actions/upload-pages-artifact@v3
        with:
          path: src/redirect
      - id: deploy
        uses: actions/deploy-pages@v4
