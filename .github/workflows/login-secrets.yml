# ログイン用の秘密の値を Cloudflare に入れる。値はログにも出さず、誰も見ない。
# - SUB_PEPPER: 利用者IDをハッシュ化するための値。初回だけ自動で作る（変えると全員のアカウントが別人扱いになるので、作り直さない）
# - GOOGLE_CLIENT_ID / GOOGLE_CLIENT_SECRET: GitHub の Secrets にナヴェが入れたものを渡す
# - GH_DISPATCH: 毎日の更新を Cloudflare から起動するための GitHub の鍵（このリポジトリの Actions 起動だけ）
name: 秘密の値の設定
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/run-secrets"]
permissions:
  contents: read
jobs:
  secrets:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
      GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
      GH_DISPATCH: ${{ secrets.GH_DISPATCH }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: 秘密の値を入れる
        run: |
          W="npx -y wrangler@4.151.0"
          have=$($W secret list --format json | jq -r '.[].name')
          if ! echo "$have" | grep -qx SUB_PEPPER; then
            openssl rand -base64 48 | tr -d '\n' | $W secret put SUB_PEPPER >/dev/null && echo "SUB_PEPPER を作成しました"
          else echo "SUB_PEPPER は設定済み（変更しません）"; fi
          for n in GOOGLE_CLIENT_ID GOOGLE_CLIENT_SECRET GH_DISPATCH; do
            v="${!n}"
            if [ -n "$v" ]; then printf %s "$v" | $W secret put $n >/dev/null && echo "$n を設定しました"; else echo "$n はまだ GitHub に入っていません"; fi
          done
      - name: 更新起動用の鍵が使えるか確認（起動はしない）
        if: env.GH_DISPATCH != ''
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' -H "authorization: Bearer $GH_DISPATCH" -H "accept: application/vnd.github+json" https://api.github.com/repos/hako1ba-bit/hakodig/actions/workflows/update.yml)
          echo "GitHubの応答: $code"; [ "$code" = "200" ]
