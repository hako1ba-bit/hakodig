# ログイン用の秘密の値を Cloudflare に入れる。値はログにも出さず、誰も見ない。
# - SUB_PEPPER: 利用者IDをハッシュ化するための値。初回だけ自動で作る（変えると全員のアカウントが別人扱いになるので、作り直さない）
# - MS_CLIENT_ID / MS_CLIENT_SECRET: GitHub の Secrets にナヴェが入れたものを渡す
name: ログインの設定
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/run-secrets"]
permissions:
  contents: read
jobs:
  secrets:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      MS_CLIENT_ID: ${{ secrets.MS_CLIENT_ID }}
      MS_CLIENT_SECRET: ${{ secrets.MS_CLIENT_SECRET }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: 秘密の値を入れる
        run: |
          W="npx -y wrangler@4.151.0"
          have=$($W secret list --format json | jq -r '.[].name')
          if ! echo "$have" | grep -qx SUB_PEPPER; then
            openssl rand -base64 48 | tr -d '\n' | $W secret put SUB_PEPPER >/dev/null && echo "SUB_PEPPER を作成しました"
          else echo "SUB_PEPPER は設定済み（変更しません）"; fi
          for n in MS_CLIENT_ID MS_CLIENT_SECRET; do
            v="${!n}"
            if [ -n "$v" ]; then printf %s "$v" | $W secret put $n >/dev/null && echo "$n を設定しました"; else echo "$n はまだ GitHub に入っていません"; fi
          done
