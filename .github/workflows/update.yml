# 毎日 4:17（日本時間）にストアの情報を取り直し、サイトを更新する
name: 毎日の更新
on:
  schedule:
    - cron: "17 19 * * *"
  workflow_dispatch:
    inputs:
      detail_minutes:
        description: 言語情報の取得に使う時間（分）
        default: "150"
  push:
    branches: [main]
    paths: [".github/run-update"]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 一覧・価格・サブスク・Play Anywhere を取得
        run: python scripts/update_list.py
      - name: 言語情報を取得（決めた時間まで）
        run: python scripts/update_details.py --minutes ${{ inputs.detail_minutes || '150' }}
      - name: データを保存
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if ! git diff --cached --quiet; then
            git commit -m "データ更新 $(TZ=Asia/Tokyo date +%F)"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - name: サイトを作る
        run: python scripts/build.py
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4
