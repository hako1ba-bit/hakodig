# 毎日 4:17（日本時間）にストアの情報を取り直し、サイトを更新する
# GitHubの定時実行は飛ばされることがあるので、5:47・7:17 にも予備で起動する。
# 予備の回は、その日の一覧更新が済んでいれば何もせず終わる。
name: 毎日の更新
on:
  schedule:
    - cron: "17 19 * * *"
    - cron: "47 20 * * *"
    - cron: "17 22 * * *"
  workflow_dispatch:
    inputs:
      detail_minutes:
        description: 言語情報の取得に使う時間（分）
        default: "300"
      skip_list:
        description: 一覧の取得を省く（続きの取得だけ行う）
        default: "no"
  push:
    branches: [main]
    paths: [".github/run-update"]

permissions:
  actions: write
  contents: write
  pages: write
  id-token: write

concurrency:
  group: update
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      go: ${{ steps.c.outputs.go }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: 今日の更新が済んでいるか確認（定時実行のときだけ）
        id: c
        run: |
          today=$(TZ=Asia/Tokyo date +%F)
          done=$(python3 -c "import json;print(json.load(open('data/meta.json')).get('list_at',''))")
          if [ "${{ github.event_name }}" = "schedule" ] && [ "$done" = "$today" ]; then
            echo "今日（$today）の更新は済んでいるので終了"; echo "go=no" >> "$GITHUB_OUTPUT"
          else
            echo "go=yes" >> "$GITHUB_OUTPUT"
          fi
  update:
    needs: check
    if: needs.check.outputs.go == 'yes'
    runs-on: ubuntu-latest
    timeout-minutes: 355
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 一覧・価格・サブスク・Play Anywhere を取得
        if: inputs.skip_list != 'yes'
        run: python scripts/update_list.py
      - name: 一覧を保存
        if: inputs.skip_list != 'yes'
        run: sh scripts/commit_data.sh "一覧更新"
      - name: 一覧の更新をすぐサイトに反映する
        if: inputs.skip_list != 'yes'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run build.yml --ref main
      - name: 言語情報を取得（決めた時間まで）
        id: details
        run: python scripts/update_details.py --minutes ${{ inputs.detail_minutes || '300' }}
      - name: 言語情報を保存
        run: sh scripts/commit_data.sh "言語情報"
      - name: サイトを作る
        run: python scripts/build.py
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4
      - name: 未取得が残っていれば、続きを起動する
        if: steps.details.outputs.left != '0'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run update.yml --ref main -f skip_list=yes -f detail_minutes=300
