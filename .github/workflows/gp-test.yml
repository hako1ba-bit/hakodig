# 一時的な確認用: ゲームパスの「まもなく終了」などの一覧が取れるか試す
name: ゲームパス一覧の確認
on:
  push:
    branches: [main]
    paths: [".github/run-gptest"]
permissions:
  contents: read
jobs:
  t:
    runs-on: ubuntu-latest
    steps:
      - run: |
          for id in 393f05bf-e596-4ef6-9487-6d4fa0eab987 cc7fc951-d00f-410e-9e02-5e4628e04163 f13cf6b4-57e6-4459-89df-6aec18cf0538 095bda36-f5cd-43f2-9ee1-0a72f371fb96 4165f752-d702-49c8-886b-fb57936f6bae; do
            echo "== $id"; curl -s "https://catalog.gamepass.com/sigls/v2?id=$id&language=ja-jp&market=JP" | head -c 700; echo
          done
