# ハコディグ本体（サイト＋ログイン・コメント用API）。GitHub Actions から deploy する
name = "hakodig"
main = "worker/index.js"
compatibility_date = "2026-10-01"
account_id = "69e27b15e9afab57457ca48ad9170b79"
workers_dev = true
preview_urls = false

[vars]
SITE = "https://hakodig.hakoichiba.workers.dev"

[assets]
directory = "./_site"
binding = "ASSETS"
not_found_handling = "none"

[[d1_databases]]
binding = "DB"
database_name = "hakodig"
database_id = "1fe5e6a1-2dd7-49f1-ade7-3c62e5642636"
migrations_dir = "worker/migrations"

# 毎日の更新の起動（UTC）：19:17 = 朝 4:17、7:32 = 夕方 16:32（日本時間）
[triggers]
# 2:07（火曜のみ）= 火曜 11:07 の追加更新（週替わりセールは日本の火曜の朝7〜10時ごろ始まり、朝の更新に間に合わないため）
crons = ["17 19 * * *", "32 7 * * *", "7 2 * * 2"]

[observability]
enabled = false
